[project]
name = "snn-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "torchfix==0.7.0", "pre-commit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
