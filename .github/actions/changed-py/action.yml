name: File Python modificati
description: Elenca i file .py modificati nella PR (o "." fuori dalle PR)
outputs:
  files:
    description: File separati da spazio, oppure "." se non siamo in una PR
    value: ${{ steps.diff.outputs.files }}
  any:
    description: "true se c'è almeno un file da controllare"
    value: ${{ steps.diff.outputs.any }}
runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "files=." >> "$GITHUB_OUTPUT"
          echo "any=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
        files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}" HEAD -- '*.py' | tr '\n' ' ')
        echo "File Python modificati: ${files:-nessuno}"
        echo "files=$files" >> "$GITHUB_OUTPUT"
        if [ -n "$files" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
