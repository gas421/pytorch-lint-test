name: Lint and test

on:
  pull_request:
  push:
    branches: [main]

# Se arriva una nuova commit (es. quella del fix), annulla la run precedente sullo stesso branch
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.16.8"

jobs:
  ruff-fix:
    # Solo sulle PR, e solo se il branch è nel repo (non da fork)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.AUTOFIX_TOKEN }}   # PAT: serve perché la nuova commit faccia ripartire la CI
      - id: changed
        uses: ./.github/actions/changed-py
      - name: Ruff fix solo sui file della PR
        if: steps.changed.outputs.any == 'true'
        run: |
          pip install "ruff==$RUFF_VERSION"
          ruff check --fix --exit-zero ${{ steps.changed.outputs.files }}
          ruff format ${{ steps.changed.outputs.files }}
      - name: Commit e push se ci sono modifiche
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "ruff-autofix[bot]"
            git config user.email "ruff-autofix@users.noreply.github.com"
            git commit -am "style: ruff autofix"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  ruff:
    needs: ruff-fix
    # Gira sempre, tranne quando il fix ha appena fatto una commit (ci penserà la nuova run)
    if: ${{ !cancelled() && needs.ruff-fix.outputs.changed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: changed
        uses: ./.github/actions/changed-py
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.any == 'true'
        with:
          python-version: "3.11"
      - name: Ruff check (solo righe modificate nella PR, tutto il repo su main)
        if: steps.changed.outputs.any == 'true'
        run: |
          pip install "ruff==$RUFF_VERSION"
          ruff check --output-format=concise --exit-zero ${{ steps.changed.outputs.files }} \
            | python scripts/diff_filter.py --base "${{ steps.changed.outputs.base }}" --level error
      - name: Ruff format (file della PR)
        if: steps.changed.outputs.any == 'true'
        run: ruff format --check ${{ steps.changed.outputs.files }}

  torchfix:
    runs-on: ubuntu-latest
    continue-on-error: true   # warning mode nelle prime settimane
    steps:
      - uses: actions/checkout@v4
      - id: changed
        uses: ./.github/actions/changed-py
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.any == 'true'
        with:
          python-version: "3.11"
      - name: TorchFix (solo righe modificate nella PR, tutto il repo su main)
        if: steps.changed.outputs.any == 'true'
        run: |
          pip install "torchfix==0.7.0"
          torchfix ${{ steps.changed.outputs.files }} 2>&1 \
            | python scripts/diff_filter.py --base "${{ steps.changed.outputs.base }}" --level warning

  test:
    # I test girano sempre su tutto: una modifica può rompere codice in altri file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install pytest
      - run: pytest -q
